<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pepitos La Negra | El Auténtico Sabor Venezolano</title>
  <meta name="description" content="Pepitos gigantes de 30 cm mixtos, hamburguesas mixtas de pollo y carne, y marquesas de chocolate. El auténtico sabor callejero venezolano con delivery express en Barquisimeto.">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0d11">
  <link rel="icon" type="image/jpeg" href="./assets/logo-opt.jpg">
  <link rel="apple-touch-icon" href="./assets/logo-opt.jpg">

  <!-- Google Fonts: Montserrat & Poppins (Exact match to reference) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- EXACT CSS STYLES INSPIRED BY THE REFERENCE -->
  <style>
    :root {
      --bg-dark: #0a0705;
      --bg-darker: #060403;
      --bg-card: #140d0a;
      --bg-card-hover: #1f140f;
      --primary-gold: #f59e0b;
      --primary-gold-hover: #d97706;
      --primary-accent: #ea580c;
      --primary-accent-hover: #c2410c;
      --flame-red: #dc2626;
      --whatsapp: #25d366;
      --whatsapp-hover: #1eb956;
      --text-white: #ffffff;
      --text-cream: #fff7ed;
      --text-muted: #a89f91;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(245, 158, 11, 0.4);
      --border-flame: rgba(234, 88, 12, 0.35);
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
      --radius-full: 9999px;
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      outline: none;
      transition: var(--transition);
    }

    /* =========================================================================
       1. HEADER FIJO (IDÉNTICO A LA REFERENCIA)
       ========================================================================= */
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 7, 5, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(245, 158, 11, 0.15);
      padding: 12px 0;
      transition: var(--transition);
    }

    .header-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 0 clamp(16px, 2.5vw, 36px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .brand-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--primary-gold);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
      background: #f4ece1;
      flex-shrink: 0;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text-block {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--primary-gold);
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 3px;
    }

    .nav-menu-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 0;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.6vw, 24px);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-link {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-white);
      position: relative;
      padding: 6px 2px;
      white-space: nowrap;
      transition: color 0.2s ease;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--primary-gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-whatsapp-header {
      background: var(--whatsapp);
      color: #ffffff;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      padding: 8px 15px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-whatsapp-header:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-2px);
    }

    .btn-admin-header {
      background: #181c24;
      border: 1.5px solid var(--primary-gold);
      color: var(--primary-gold);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .btn-admin-header:hover, .btn-admin-header.active {
      background: var(--primary-gold);
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-orders-header {
      background: #1c132b;
      border: 1.5px solid #8b5cf6;
      color: #f1f5f9;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.25);
      transition: all 0.22s ease;
    }

    .btn-orders-header:hover, .btn-orders-header.active {
      background: #8b5cf6;
      border-color: #a78bfa;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    }

    .orders-count-badge {
      background: #8b5cf6;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      min-width: 18px;
      text-align: center;
      line-height: 1.2;
    }

    .btn-cart-header {
      background: var(--primary-gold);
      color: #000000;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-cart-header:hover {
      background: var(--primary-accent);
      transform: translateY(-2px);
    }

    .cart-count-badge {
      background: #000000;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: var(--radius-full);
    }

    /* =========================================================================
       2. HERO SECTION (MODELO VISUAL EXACTO DE LA CAPTURA)
       ========================================================================= */
    .hero-section {
      position: relative;
      min-height: 92vh;
      display: flex;
      align-items: center;
      padding: 60px 24px 60px;
      background: radial-gradient(circle at 65% 45%, #2d140a 0%, #150a06 55%, #080504 100%);
      overflow: hidden;
    }

    .hero-watermark {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-heading);
      font-size: clamp(5rem, 13vw, 15rem);
      font-weight: 900;
      line-height: 0.85;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      letter-spacing: -2px;
    }

    .hero-watermark span {
      display: block;
      text-align: center;
      -webkit-text-stroke: 1.5px rgba(245, 158, 11, 0.06);
      color: transparent;
    }

    .hero-container {
      max-width: 1360px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      align-items: center;
      gap: 50px;
      position: relative;
      z-index: 2;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-badge-pill {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--border-gold);
      color: var(--primary-accent);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hero-title-main {
      font-family: var(--font-heading);
      font-size: clamp(2.8rem, 5.2vw, 5.2rem);
      font-weight: 900;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .hero-title-main .title-white {
      display: block;
      color: var(--text-white);
    }

    .hero-title-main .title-highlight {
      display: block;
      color: var(--primary-gold);
      font-style: italic;
      font-weight: 900;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.6;
    }

    .hero-cta-group {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-primary-hero {
      background: var(--primary-gold);
      color: #000000;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      padding: 16px 32px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      cursor: pointer;
    }

    .btn-primary-hero:hover {
      background: var(--primary-accent);
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
    }

    .btn-secondary-hero {
      border: 2px solid #ffffff;
      color: #ffffff;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      padding: 14px 28px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      cursor: pointer;
    }

    .btn-secondary-hero:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary-gold);
      color: var(--primary-gold);
      transform: translateY(-3px);
    }

    /* Columna Derecha: Stack de Tarjetas 3D */
    .hero-visual-stack-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 480px;
    }

    .card-stack {
      position: relative;
      width: 320px;
      height: 450px;
    }

    .stack-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 14px;
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      user-select: none;
    }

    .stack-card.card-back-left {
      transform: rotate(-7deg) translate(-28px, -12px) scale(0.95);
      z-index: 1;
    }

    .stack-card.card-back-right {
      transform: rotate(6deg) translate(28px, -8px) scale(0.96);
      z-index: 2;
    }

    .stack-card.card-front {
      transform: rotate(-1.5deg) translate(0, 0) scale(1);
      z-index: 5;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.2);
    }

    .card-stack:hover .card-back-left {
      transform: rotate(-10deg) translate(-38px, -15px) scale(0.95);
    }

    .card-stack:hover .card-back-right {
      transform: rotate(9deg) translate(38px, -10px) scale(0.96);
    }

    .card-stack:hover .card-front {
      transform: rotate(0deg) translateY(-6px) scale(1.02);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.7), 0 0 32px rgba(245, 158, 11, 0.3);
    }

    .card-img-box {
      width: 100%;
      height: 230px;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.85);
      color: var(--primary-gold);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
    }

    .card-details {
      padding: 12px 6px 4px;
      display: flex;
      flex-direction: column;
      color: #111827;
      flex: 1;
    }

    .card-flavor-name {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #0f172a;
      line-height: 1.2;
    }

    .card-desc-short {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .hero-size-single-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      color: #f59e0b;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 10px;
      width: fit-content;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .hero-card-price {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f172a;
    }

    .hero-quick-add {
      background: var(--whatsapp);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
    }

    .hero-quick-add:hover {
      background: var(--whatsapp-hover);
      transform: scale(1.05);
    }

    /* Sello Circular Giratorio */
    .rotating-stamp {
      position: absolute;
      bottom: -20px;
      right: -25px;
      width: 120px;
      height: 120px;
      z-index: 8;
      pointer-events: none;
    }

    .rotating-stamp svg {
      width: 100%;
      height: 100%;
      animation: spinStamp 18s linear infinite;
    }

    @keyframes spinStamp {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* =========================================================================
       3. CINTA MARQUEE / TICKER TAPE
       ========================================================================= */
    .marquee-ribbon {
      background: var(--primary-gold);
      color: #000000;
      padding: 14px 0;
      overflow: hidden;
      white-space: nowrap;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    .marquee-content {
      display: inline-flex;
      gap: 28px;
      animation: marquee 24s linear infinite;
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 28px;
    }

    .star-icon {
      font-size: 0.85rem;
      color: #000000;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* =========================================================================
       4. WHATSAPP FLOTANTE
       ========================================================================= */
    .floating-whatsapp-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .whatsapp-tooltip {
      background: #ffffff;
      color: #0f172a;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: floatTooltip 3s ease-in-out infinite;
    }

    .whatsapp-btn-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--whatsapp);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
      transition: all 0.25s ease;
    }

    .whatsapp-btn-circle:hover {
      background: var(--whatsapp-hover);
      transform: scale(1.1);
    }

    @keyframes floatTooltip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .nav-menu-wrapper { display: none; }
      .hero-container { grid-template-columns: 1fr; gap: 40px; text-align: center; }
      .hero-content { align-items: center; }
      .hero-subtitle { margin: 0 auto; }
      .hero-cta-group { justify-content: center; }
    }

    /* =========================================================================
       5. CHAT MODAL OVERLAY & WORKSPACE (PRIORIDAD MÁXIMA Z-INDEX: 999999)
       ========================================================================= */
    .chat-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999 !important;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
      animation: fadeInModal 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInModal {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .chat-modal-box {
      background: #100a07;
      border: 1px solid rgba(245, 158, 11, 0.4);
      width: 100%;
      max-width: 880px;
      height: 90vh;
      max-height: 840px;
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.98), 0 0 45px rgba(245, 158, 11, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 640px) {
      .chat-modal-overlay {
        padding: 0;
      }
      .chat-modal-box {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    /* Ocultar barra de scroll horizontal en respuestas rápidas en todos los navegadores */
    .no-scrollbar::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    .no-scrollbar {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    /* Scrollbar vertical sutil y estilizado para los mensajes */
    .chat-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll-area::-webkit-scrollbar-track {
      background: #0d0705;
    }
    .chat-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.3);
      border-radius: 9999px;
    }
    .chat-scroll-area::-webkit-scrollbar-thumb:hover {

          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                    className="flex-1 bg-[#090604] border border-amber-500/35 focus:border-amber-400 text-white rounded-xl px-4 py-3 text-xs sm:text-sm outline-none transition placeholder-gray-500 shadow-inner"
                    autoFocus
                  />
                  <button
                    type="submit"
                    className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-5 sm:px-6 py-3 rounded-xl text-xs sm:text-sm transition-all shadow-lg flex items-center gap-1.5 active:scale-95 flex-shrink-0 cursor-pointer"
                  >
                    <span>Enviar</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                  </button>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
