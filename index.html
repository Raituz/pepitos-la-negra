    // --- SYNTHESIZED SOUND EFFECTS (Web Audio API - 0 external files) ---
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'cash') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'triangle';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(987.77, ctx.currentTime); // B5
          osc2.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08); // E6
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start();
          osc2.start(ctx.currentTime + 0.08);
          osc1.stop(ctx.currentTime + 0.45);
          osc2.stop(ctx.currentTime + 0.45);
        } else if (type === 'ding') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(784, ctx.currentTime);
          osc.frequency.setValueAtTime(1046.5, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {
        console.warn('Audio note allowed yet', e);
      }
    };

        const saved = localStorage.getItem('pepitos_orders');
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;

      const [cart, setCart] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [chatOpen, setChatOpen] = useState(false);
      const [activeChatOrder, setActiveChatOrder] = useState(null);
      const [newMessage, setNewMessage] = useState('');
      const [smsNotification, setSmsNotification] = useState(null);
      const [installPrompt, setInstallPrompt] = useState(null);

      useEffect(() => {
        localStorage.setItem('pepitos_orders', JSON.stringify(orders));
        try {
          const channel = new BroadcastChannel('pepitos_channel');
          channel.postMessage({ type: 'SYNC_ORDERS', orders });
          channel.close();
        } catch (e) {}
      }, [orders]);

      useEffect(() => {
        try {
          const channel = new BroadcastChannel('pepitos_channel');
          channel.onmessage = (event) => {
            if (event.data?.type === 'SYNC_ORDERS') {
              setOrders(event.data.orders);
            }
          };
          return () => channel.close();
        } catch (e) {}
      }, []);

      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setInstallPrompt(e);
        });
      }, []);

      // Auto simulation for orders in state 1
      useEffect(() => {
        const pendingOrder = orders.find(o => o.status === 1);
        if (pendingOrder) {
          const timer = setTimeout(() => {
            simulateProvincialSMS(pendingOrder.id, pendingOrder.reference, pendingOrder.totalBs);
          }, 6000);
          return () => clearTimeout(timer);
        }
      }, [orders]);

      const simulateProvincialSMS = (orderId, ref, amountBs) => {
        playSound('cash');
        try {
          confetti({ particleCount: 60, spread: 70, origin: { y: 0.25 } });
        } catch (e) {}

        const smsText = `Provincial: Pago Movil recibido por Bs. ${amountBs} de CI 32.705.849, Ref: ****${ref} exitoso.`;
        setSmsNotification({
          orderId,
          text: smsText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        setOrders(prev => prev.map(o => {
          if (o.id === orderId && o.status === 1) {
            return {
              ...o,
              status: 2,
              messages: [
                ...o.messages,
                {
                  sender: 'system',
                  text: `✅ SMS Provincial Recibido: Pago de Bs. ${amountBs} verificado automáticamente (Ref: ${ref}).`,
                  time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
              ]
            };
          }
          return o;
        }));

        setTimeout(() => setSmsNotification(null), 8000);
      };

      const addToCart = (product, options) => {
        playSound('pop');
        const itemTotal = (product.price + (options.extrasTotal || 0)) * options.quantity;
        const newItem = {
          cartId: Date.now() + Math.random(),
          id: product.id,
          name: product.name,
          basePrice: product.price,
          unitPrice: product.price + (options.extrasTotal || 0),
          quantity: options.quantity,
          sauces: options.sauces || [],
          extras: options.extras || [],
          notes: options.notes || '',
          itemTotal
        };
        setCart(prev => [...prev, newItem]);
        setSelectedProduct(null);
      };

      const removeFromCart = (cartId) => setCart(prev => prev.filter(item => item.cartId !== cartId));

      const updateQuantity = (cartId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartId === cartId) {
            const newQty = item.quantity + delta;
            if (newQty <= 0) return null;
            return { ...item, quantity: newQty, itemTotal: item.unitPrice * newQty };
          }
          return item;
        }).filter(Boolean));
      };

      const cartSubtotal = cart.reduce((acc, i) => acc + i.itemTotal, 0);

          address: orderData.address,

            price: i.unitPrice,

          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                      <div

                        className="bg-brand-card hover:bg-brand-cardHover transition-all duration-300 border border-brand-border hover:border-brand-500/50 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between group"

                            alt={product.name}

                          <div className="absolute top-3 left-3 bg-black/80 backdrop-blur-md text-brand-400 text-xs font-black px-3 py-1 rounded-full border border-brand-500/30">

                          <div className="absolute bottom-3 right-3 bg-brand-500/90 text-black font-black text-xs px-2.5 py-1 rounded-xl shadow-lg">

                        {/* Product Body */}
                        <div className="p-5 flex-1 flex flex-col justify-between space-y-4">

                            </h3>
                            <p className="text-xs font-bold text-brand-400/90 mt-1">
                              {product.tagline}
                            </p>
                            <p className="text-xs text-gray-300 mt-2 leading-relaxed">
                              {product.description}
                            </p>

                            {product.hasOptions && (
                              <div className="mt-3 flex flex-wrap gap-1.5 text-[11px] text-gray-400">
                                <span className="bg-black/50 px-2.5 py-1 rounded-lg border border-white/5">
                                  🥣 Elige tus salsas favoritas
                                </span>
                                <span className="bg-black/50 px-2.5 py-1 rounded-lg border border-white/5">
                                  🧀 Agrega extras
                                </span>
                              </div>
                            )}
                          </div>

                          {/* Price & Add to Cart button */}
                          <div className="pt-4 border-t border-white/5 flex items-center justify-between">
                            <div>
                              <div className="text-2xl font-black text-white font-display">
                                ${product.price.toFixed(2)}
                              </div>
                              <div className="text-xs font-bold text-brand-400">
                                Bs. {priceBs}
                              </div>
                            </div>

                            <button
                              onClick={() => onSelectProduct(product)}
                              className="bg-brand-500 hover:bg-brand-400 active:scale-95 text-black font-extrabold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-brand-500/25 flex items-center gap-2 transition-all"
                            >
                              <IconPlus className="w-4 h-4 text-black stroke-[3]" />
                              <span>{product.hasOptions ? 'Personalizar' : 'Agregar'}</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

              </div>

            </div>
          )}

          {/* VIEW: CART */}
          {view === 'cart' && (
            <div className="max-w-2xl mx-auto bg-brand-card border border-brand-border rounded-3xl p-6 shadow-2xl">
              <div className="flex items-center justify-between pb-4 border-b border-brand-border mb-4">
                <h2 className="text-xl font-black text-white font-display flex items-center gap-2">
                  <IconCart className="w-6 h-6 text-brand-500" />
                  <span>Tu Carrito de Compras</span>
                </h2>
                <button
                  onClick={() => setView('menu')}
                  className="text-xs font-bold text-gray-400 hover:text-white"
                >
                  + Agregar más
                </button>
              </div>

              {cart.length === 0 ? (
                <div className="text-center py-12">
                  <div className="text-5xl mb-3">🛒</div>
                  <h3 className="text-lg font-bold text-white">Tu carrito está vacío</h3>
                  <p className="text-xs text-gray-400 mt-1 max-w-xs mx-auto">
                    ¿Se te antoja un pepito gigante o una marquesa fría? Vuelve al menú y agrega tus favoritos.
                  </p>
                  <button
                    onClick={() => setView('menu')}
                    className="mt-5 bg-brand-500 text-black font-extrabold px-6 py-2.5 rounded-xl text-sm"
                  >
                    Ver Menú Delicioso
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  {cart.map(item => (
                    <div
                      key={item.cartId}
                      className="bg-black/40 border border-white/5 rounded-2xl p-4 flex flex-col sm:flex-row justify-between gap-3"
                    >
                      <div className="flex-1">
                        <div className="flex items-center justify-between">
                          <h4 className="font-extrabold text-white text-sm">{item.name}</h4>
                          <span className="font-extrabold text-brand-400 text-sm">
                            ${item.itemTotal.toFixed(2)}
                          </span>
                        </div>
                        {item.sauces.length > 0 && (
                          <div className="text-xs text-gray-400 mt-1">
                            <span className="font-semibold text-gray-300">Salsas:</span> {item.sauces.join(', ')}
                          </div>
                        )}
                        {item.extras.length > 0 && (
                          <div className="text-xs text-brand-300 mt-0.5">
                            <span className="font-semibold text-gray-300">Extras:</span> {item.extras.map(e => e.name).join(', ')}

                        )}
                        {item.notes && (
                          <div className="text-xs text-amber-200/70 italic mt-0.5">
                            Nota: "{item.notes}"

                        )}

                      <div className="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-white/5">
                        <div className="flex items-center bg-black rounded-lg border border-white/10 px-1 py-0.5">
                          <button
                            onClick={() => updateQuantity(item.cartId, -1)}
                            className="p-1 text-gray-400 hover:text-white"
                          >
                            <IconMinus className="w-3.5 h-3.5" />

                            className="p-1 text-gray-400 hover:text-white"

                            <IconPlus className="w-3.5 h-3.5" />

                        </div>
                        <button

                  {/* Summary */}
                  <div className="pt-4 border-t border-brand-border space-y-2 text-sm">
                    <div className="flex justify-between text-gray-300">
                      <span>Subtotal:</span>

                    </div>
                    <div className="flex justify-between text-gray-300">
                      <span>Costo de Delivery:</span>
                      <span>{deliveryFee === 0 ? '¡GRATIS!' : `$${deliveryFee.toFixed(2)}`}</span>
                    </div>
                    <div className="flex justify-between items-baseline font-black text-lg text-white pt-2 border-t border-white/10">
                      <span>Total a Pagar:</span>
                      <div className="text-right">
                        <div className="text-2xl text-brand-500">${cartTotal.toFixed(2)}</div>
                        <div className="text-xs font-bold text-brand-300">Bs. {cartTotalBs}</div>
                      </div>
                    </div>
                  </div>

                  {/* Checkout Button */}
                  <button
                    onClick={() => setView('checkout')}
                    className="w-full mt-4 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-black font-black py-4 rounded-2xl shadow-xl shadow-brand-500/25 text-base uppercase tracking-wide transition-all active:scale-98"
                  >
                    Proceder al Checkout & Pago Móvil →
                  </button>
                </div>
              )}
            </div>
          )}

          {/* VIEW: CHECKOUT */}
          {view === 'checkout' && (
            <div className="max-w-2xl mx-auto">
              <CheckoutForm
                cartTotal={cartTotal}
                cartTotalBs={cartTotalBs}
                cartSubtotal={cartSubtotal}
                deliveryFee={deliveryFee}
                bcvRate={BCV_RATE}
                onBack={() => setView('cart')}
                onConfirmOrder={onCreateOrder}
              />
            </div>
          )}

          {/* VIEW: TRACKING / MIS PEDIDOS */}
          {view === 'tracking' && (
            <div className="max-w-2xl mx-auto">
              <OrderTrackingView
                orders={orders}
                activeOrderId={activeOrderId}
                setActiveOrderId={setActiveOrderId}
                currentOrder={currentOrder}
                openChat={openChat}
                onBackToMenu={() => setView('menu')}
              />
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 2. CHECKOUT COMPONENT & PAGO MÓVIL
    // ==========================================
    function CheckoutForm({ cartTotal, cartTotalBs, onBack, onConfirmOrder }) {
      const [customerName, setCustomerName] = useState('Cliente Demo');
      const [phone, setPhone] = useState('0412-1234567');
      const [deliveryType, setDeliveryType] = useState('delivery');
      const [address, setAddress] = useState('Urb. Nueva Segovia, Carrera 1 con Calle 4, Casa #12');
      const [locationGeo, setLocationGeo] = useState(null);
      const [geoLoading, setGeoLoading] = useState(false);
      const [geoSuccess, setGeoSuccess] = useState(false);
      const [reference, setReference] = useState('');
      const [copiedField, setCopiedField] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      const handleGetLocation = () => {
        if (!navigator.geolocation) {
          alert('Tu navegador no soporta geolocalización.');
          return;
        }
        setGeoLoading(true);
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            setLocationGeo({ lat: latitude, lng: longitude });
            setAddress(prev => `${prev || 'Mi Ubicación GPS'} (Lat: ${latitude.toFixed(4)}, Lng: ${longitude.toFixed(4)})`);
            setGeoLoading(false);
            setGeoSuccess(true);
            playSound('pop');
          },
          (error) => {
            console.warn('Geolocation error:', error);
            setLocationGeo({ lat: 10.0636, lng: -69.3248 });
            setAddress(prev => `${prev || 'Ubicación actual'} (GPS Simulado: 10.0636, -69.3248)`);
            setGeoLoading(false);
            setGeoSuccess(true);
          },
          { timeout: 7000 }
        );
      };

      const copyToClipboard = (text, fieldName) => {
        navigator.clipboard.writeText(text);
        setCopiedField(fieldName);
        playSound('pop');
        setTimeout(() => setCopiedField(null), 2000);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!customerName.trim() || !phone.trim()) {
          setErrorMsg('Por favor completa tu nombre y teléfono.');
          return;
        }
        if (deliveryType === 'delivery' && !address.trim()) {
          setErrorMsg('Por favor indica tu dirección de entrega.');
          return;
        }
        if (!reference || reference.trim().length < 4) {
          setErrorMsg('Por favor ingresa los 4 dígitos de la referencia de tu Pago Móvil.');
          return;
        }

        setErrorMsg('');
        onConfirmOrder({
          customerName,
          phone,
          deliveryType,
          address,
          locationGeo,
          reference: reference.trim().slice(-4)
        });
      };

      return (
        <form onSubmit={handleSubmit} className="bg-brand-card border border-brand-border rounded-3xl p-6 shadow-2xl space-y-6">
          <div className="flex items-center justify-between pb-3 border-b border-brand-border">
            <button
              type="button"
              onClick={onBack}
              className="text-xs font-bold text-gray-400 hover:text-white flex items-center gap-1"
            >
              ← Volver al Carrito
            </button>
            <h2 className="text-lg font-black text-white font-display">
              Finalizar Pedido
            </h2>
            <div className="text-sm font-extrabold text-brand-500">${cartTotal.toFixed(2)}</div>
          </div>

          {errorMsg && (
            <div className="bg-red-500/20 border border-red-500/50 text-red-200 text-xs p-3 rounded-xl">
              ⚠️ {errorMsg}
            </div>
          )}

          {/* 1. Datos Personales */}
          <div>
            <h3 className="text-xs uppercase tracking-wider font-extrabold text-brand-400 mb-3 flex items-center gap-1.5">
              <span>👤</span> 1. Datos del Cliente
            </h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="text-[11px] text-gray-400 font-semibold block mb-1">Nombre Completo</label>
                <input
                  type="text"
                  required
                  value={customerName}
                  onChange={(e) => setCustomerName(e.target.value)}
                  placeholder="Ej. Lismaury Torres"
                  className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500"
                />
              </div>
              <div>
                <label className="text-[11px] text-gray-400 font-semibold block mb-1">Teléfono / WhatsApp</label>
                <input
                  type="text"
                  required
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  placeholder="Ej. 0412-0424336"
                  className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500"
                />
              </div>
            </div>
          </div>

          {/* 2. Método de Entrega & Ubicación */}
          <div>
            <h3 className="text-xs uppercase tracking-wider font-extrabold text-brand-400 mb-3 flex items-center gap-1.5">
              <IconMapPin className="w-4 h-4 text-brand-400" />
              <span>2. Entrega y Ubicación</span>
            </h3>

            <div className="grid grid-cols-2 gap-3 mb-3">
              <button
                type="button"
                onClick={() => setDeliveryType('delivery')}
                className={`py-2.5 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition-all ${
                  deliveryType === 'delivery'
                    ? 'bg-brand-500/20 border-brand-500 text-brand-400'
                    : 'bg-black/30 border-white/10 text-gray-400 hover:text-white'
                }`}
              >
                <span>🛵</span> Delivery a Domicilio
              </button>
              <button
                type="button"
                onClick={() => setDeliveryType('pickup')}
                className={`py-2.5 px-3 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition-all ${
                  deliveryType === 'pickup'
                    ? 'bg-brand-500/20 border-brand-500 text-brand-400'
                    : 'bg-black/30 border-white/10 text-gray-400 hover:text-white'
                }`}
              >
                <span>🏪</span> Retiro en Local
              </button>
            </div>

            {deliveryType === 'delivery' && (
              <div className="space-y-2">
                <label className="text-[11px] text-gray-400 font-semibold block">Dirección Exacta de Entrega</label>
                <textarea
                  rows="2"
                  required
                  value={address}
                  onChange={(e) => setAddress(e.target.value)}
                  placeholder="Calle, avenida, edificio/casa, piso, punto de referencia..."
                  className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500"
                />

                <div className="flex flex-wrap items-center gap-2 pt-1">
                  <button
                    type="button"
                    onClick={handleGetLocation}
                    disabled={geoLoading}
                    className="bg-brand-cardHover hover:bg-brand-border border border-brand-500/40 text-brand-300 hover:text-white font-bold text-xs px-3.5 py-2 rounded-xl flex items-center gap-2 transition-all"
                  >
                    <IconMapPin className="w-4 h-4 text-brand-500" />
                    <span>{geoLoading ? 'Localizando GPS...' : '📍 Obtener mi ubicación actual'}</span>
                  </button>

                  {geoSuccess && (
                    <span className="text-xs text-emerald-400 flex items-center gap-1 font-semibold">
                      <IconCheck className="w-4 h-4" /> GPS sincronizado
                    </span>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* 3. PAGO MÓVIL EXCLUSIVO */}
          <div>
            <h3 className="text-xs uppercase tracking-wider font-extrabold text-brand-400 mb-3 flex items-center gap-1.5">
              <span>💳</span> 3. Pago Móvil Exclusivo
            </h3>

            <div className="bg-gradient-to-br from-[#1e1b18] via-[#2a241e] to-[#120f0c] border border-brand-500/40 rounded-2xl p-4 sm:p-5 shadow-2xl relative overflow-hidden">
              <div className="flex items-center justify-between border-b border-white/10 pb-3 mb-3">
                <div className="flex items-center gap-2">
                  <span className="text-lg">🏦</span>
                  <div>
                    <div className="font-extrabold text-white text-sm">Banco Provincial (0108)</div>
                    <div className="text-[11px] text-brand-400 font-semibold">Lismaury Torres</div>
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-xs text-gray-400">Total a Transferir</div>
                  <div className="text-lg font-black text-brand-400">Bs. {cartTotalBs}</div>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                <div className="flex items-center justify-between bg-black/40 p-2 rounded-xl border border-white/5">
                  <div>
                    <span className="text-gray-400 text-[10px] block">Banco</span>
                    <span className="font-bold text-white">Provincial (0108)</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => copyToClipboard('0108', 'banco')}
                    className="text-brand-400 hover:text-white p-1"
                    title="Copiar Banco"
                  >
                    {copiedField === 'banco' ? <IconCheck className="w-4 h-4 text-emerald-400" /> : <IconCopy className="w-4 h-4" />}
                  </button>
                </div>

                <div className="flex items-center justify-between bg-black/40 p-2 rounded-xl border border-white/5">
                  <div>
                    <span className="text-gray-400 text-[10px] block">Teléfono</span>
                    <span className="font-bold text-white">0412-0424336</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => copyToClipboard('04120424336', 'telf')}
                    className="text-brand-400 hover:text-white p-1"
                    title="Copiar Teléfono"
                  >
                    {copiedField === 'telf' ? <IconCheck className="w-4 h-4 text-emerald-400" /> : <IconCopy className="w-4 h-4" />}
                  </button>
                </div>

                <div className="flex items-center justify-between bg-black/40 p-2 rounded-xl border border-white/5">
                  <div>
                    <span className="text-gray-400 text-[10px] block">Cédula</span>
                    <span className="font-bold text-white">32.705.849</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => copyToClipboard('32705849', 'ci')}
                    className="text-brand-400 hover:text-white p-1"
                    title="Copiar Cédula"
                  >
                    {copiedField === 'ci' ? <IconCheck className="w-4 h-4 text-emerald-400" /> : <IconCopy className="w-4 h-4" />}
                  </button>
                </div>

                <div className="flex items-center justify-between bg-black/40 p-2 rounded-xl border border-white/5">
                  <div>
                    <span className="text-gray-400 text-[10px] block">Monto Exacto (Bs)</span>
                    <span className="font-bold text-brand-300">Bs. {cartTotalBs}</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => copyToClipboard(cartTotalBs, 'monto')}
                    className="text-brand-400 hover:text-white p-1"
                    title="Copiar Monto"
                  >
                    {copiedField === 'monto' ? <IconCheck className="w-4 h-4 text-emerald-400" /> : <IconCopy className="w-4 h-4" />}
                  </button>
                </div>
              </div>
            </div>

            <div className="mt-4 bg-black/30 border border-brand-500/30 rounded-2xl p-4">
              <label className="block text-xs font-bold text-white mb-1">
                Últimos 4 dígitos de la Referencia de Pago Móvil:
              </label>
              <div className="flex items-center gap-3">
                <input
                  type="text"
                  maxLength="8"
                  required
                  value={reference}
                  onChange={(e) => setReference(e.target.value.replace(/\D/g, ''))}
                  placeholder="Ej. 8492"
                  className="bg-black border border-brand-500/50 rounded-xl px-4 py-2.5 text-lg font-mono font-black text-brand-400 tracking-widest text-center w-36 focus:outline-none focus:border-brand-400"
                />
                <span className="text-xs text-gray-400 leading-tight">
                  Ingresa los dígitos para que nuestro sistema verifique tu pago en tiempo real con Banco Provincial.
                </span>
              </div>
            </div>
          </div>

          <button
            type="submit"
            className="w-full bg-gradient-to-r from-brand-500 via-brand-600 to-brand-500 hover:from-brand-400 hover:to-brand-500 text-black font-black py-4 rounded-2xl shadow-2xl shadow-brand-500/30 text-base uppercase tracking-wider transition-all active:scale-98"
          >
            Confirmar y Verificar Pago Móvil 🚀
          </button>
        </form>
      );
    }

    // ==========================================
    // 3. SEGUIMIENTO DE PEDIDOS & COMPROBANTE DIGITAL
    // ==========================================
    function OrderTrackingView({ orders, activeOrderId, setActiveOrderId, currentOrder, openChat, onBackToMenu }) {
      const [showReceipt, setShowReceipt] = useState(false);

      if (!currentOrder) {
        return (
          <div className="text-center py-12 bg-brand-card border border-brand-border rounded-3xl p-6">
            <h3 className="text-lg font-bold text-white">No tienes pedidos activos</h3>
            <p className="text-xs text-gray-400 mt-1">Haz tu primer pedido para ver el seguimiento en vivo.</p>
            <button
              onClick={onBackToMenu}
              className="mt-4 bg-brand-500 text-black font-bold px-5 py-2 rounded-xl text-xs"
            >
              Ir al Menú
            </button>
          </div>
        );
      }

      const states = [
        { num: 1, title: 'Por pagar', desc: 'Esperando validación de la referencia bancaria', icon: '🟡' },
        { num: 2, title: 'Pago completado y verificado', desc: 'Verificado automáticamente con Banco Provincial', icon: '🟢' },
        { num: 3, title: 'En preparación para delivery', desc: 'Cocina preparando tus pepitos y empacando caliente', icon: '🔵' },
        { num: 4, title: 'Entregado al cliente', desc: '¡Buen provecho! Pedido entregado en tus manos', icon: '🟣' }
      ];

      return (
        <div className="space-y-6">

        }
        if (tab === 'active') return o.status === 2 || o.status === 3 || o.status === 1;
        if (tab === 'delivered') return o.status === 4;

                  time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

              </div>
              <div>
                <div className="inline-block bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">
                  En Ruta • Disponible
                </div>
                <h2 className="text-lg font-black text-white font-display">Carlos Gómez</h2>
                <p className="text-xs text-gray-400">Moto Bera SBR 150 Roja • 0414-9988771</p>
              </div>
            </div>

            <div className="text-right">
              <div className="text-xs text-gray-400">Entregas Hoy</div>
              <div className="text-2xl font-black text-white font-display">
                {orders.filter(o => o.status === 4).length}
              </div>
            </div>
          </div>

          <h3 className="text-sm font-extrabold text-brand-400 uppercase tracking-wider flex items-center gap-2">
            <span>📦</span> Pedidos Asignados para Entregar ({driverOrders.length})
          </h3>

          {driverOrders.length === 0 ? (
            <div className="text-center py-12 bg-brand-card border border-brand-border rounded-3xl p-6 text-gray-400 text-xs">
              <div className="text-4xl mb-2">🏁</div>
              <div className="font-bold text-white text-sm">No tienes entregas pendientes</div>
              <p className="mt-1">Nuevos pedidos aparecerán aquí automáticamente en tiempo real.</p>
            </div>
          ) : (
            <div className="space-y-4">
              {driverOrders.map(order => (
                <div
                  key={order.id}
                  className="bg-brand-card border border-brand-border rounded-3xl p-5 shadow-2xl space-y-4"
                >
                  <div className="flex items-center justify-between pb-3 border-b border-brand-border">
                    <div>
                      <span className="text-lg font-black text-white font-display">#{order.id}</span>
                      <span className="text-xs text-brand-400 font-bold block">{order.customerName}</span>
                    </div>
                    <div className="text-right">
                      <span className="text-base font-black text-white">${order.total.toFixed(2)}</span>
                      <span className="text-xs text-emerald-400 font-bold block">✓ Pagado (Ref: {order.reference})</span>
                    </div>
                  </div>

                  <div className="bg-black/40 border border-white/5 rounded-2xl p-3 space-y-2 text-xs">
                    <div className="flex items-start gap-2">
                      <IconMapPin className="w-5 h-5 text-brand-500 shrink-0 mt-0.5" />
                      <div>
                        <span className="text-gray-400 block font-semibold">Dirección de Entrega:</span>
                        <span className="text-white font-bold">{order.address}</span>
                      </div>
                    </div>

                    <div className="pt-2 flex flex-wrap gap-2">
                      <a
                        href={`https://maps.google.com/?q=${encodeURIComponent(order.address)}`}
                        target="_blank"
                        className="bg-blue-600/30 hover:bg-blue-600/50 text-blue-200 border border-blue-500/40 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5"
                      >
                        <span>🗺️</span> Abrir en Google Maps / Waze
                      </a>
                      <a
                        href={`tel:${order.phone}`}
                        className="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5"
                      >
                        <span>📞</span> Llamar Cliente
                      </a>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-2">
                    <button
                      onClick={() => openChat(order)}
                      className="bg-black/60 text-gray-300 hover:text-white border border-white/10 px-4 py-3 rounded-2xl text-xs font-bold flex items-center gap-2"
                    >
                      <IconChat className="w-4 h-4 text-brand-400" />
                      <span>Chat con Cliente</span>
                    </button>

                    <button
                      onClick={() => setPhotoModalOrder(order)}
                      className="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black py-3 rounded-2xl text-xs uppercase tracking-wider shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2"
                    >
                      <IconCamera className="w-4 h-4" />
                      <span>📸 Marcar como Entregado</span>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {photoModalOrder && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#1a1613] border-2 border-purple-500/50 rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
                <button
                  onClick={() => setPhotoModalOrder(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white"
                >
                  <IconX className="w-5 h-5" />
                </button>

                <div className="text-center pb-3">
                  <div className="w-12 h-12 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center text-2xl mx-auto mb-2 border border-purple-500/30">
                    📸
                  </div>
                  <h3 className="font-black text-lg text-white font-display">Confirmar Entrega</h3>
                  <p className="text-xs text-gray-400">Pedido #{photoModalOrder.id} • {photoModalOrder.customerName}</p>
                </div>

                <div className="my-4 bg-black/50 border-2 border-dashed border-gray-700 rounded-2xl p-4 text-center">
                  {uploadedPhoto ? (
                    <div>
                      <div className="text-emerald-400 font-bold text-xs flex items-center justify-center gap-1 mb-1">
                        <IconCheck className="w-4 h-4" /> Foto de Evidencia Capturada
                      </div>
                      <p className="text-[11px] text-gray-400">Entrega en puerta verificada con GPS.</p>
                    </div>
                  ) : (
                    <div>
                      <IconCamera className="w-8 h-8 text-gray-500 mx-auto mb-2" />
                      <button
                        type="button"
                        onClick={() => setUploadedPhoto('evidencia_entrega_' + Date.now() + '.jpg')}
                        className="bg-brand-500/20 hover:bg-brand-500/30 text-brand-300 border border-brand-500/40 text-xs font-bold px-3 py-1.5 rounded-xl"
                      >
                        Subir / Tomar Foto de Entrega
                      </button>
                      <p className="text-[10px] text-gray-500 mt-2">O confirma directamente la entrega en el sitio</p>
                    </div>
                  )}
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => markDelivered(photoModalOrder.id)}
                    className="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg"
                  >
                    Confirmar Entrega en Sitio (Estado 4) ✓
                  </button>
                  <button
                    onClick={() => setPhotoModalOrder(null)}
                    className="w-full bg-white/5 text-gray-400 text-xs py-2 rounded-xl"
                  >
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. PRODUCT CUSTOMIZATION MODAL (PEPITO OPTIONS)
    // ==========================================
    function ProductCustomizeModal({ product, onClose, onAddToCart }) {
      const [quantity, setQuantity] = useState(1);
      const [selectedSauces, setSelectedSauces] = useState(product.defaultSauces || []);
      const [selectedExtras, setSelectedExtras] = useState([]);
      const [notes, setNotes] = useState('');

      const toggleSauce = (sauce) => {
        if (selectedSauces.includes(sauce)) {
          setSelectedSauces(selectedSauces.filter(s => s !== sauce));
        } else {
          setSelectedSauces([...selectedSauces, sauce]);
        }
      };

      const toggleExtra = (extra) => {
        if (selectedExtras.some(e => e.name === extra.name)) {
          setSelectedExtras(selectedExtras.filter(e => e.name !== extra.name));
        } else {
          setSelectedExtras([...selectedExtras, extra]);
        }
      };

      const extrasTotal = selectedExtras.reduce((acc, e) => acc + e.price, 0);
      const finalPrice = (product.price + extrasTotal) * quantity;
      const finalPriceBs = (finalPrice * BCV_RATE).toFixed(2);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-[#181512] border-t sm:border border-brand-500/40 rounded-t-3xl sm:rounded-3xl max-w-md w-full max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div className="relative h-48 w-full bg-black shrink-0">
              <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
              <button
                onClick={onClose}
                className="absolute top-3 right-3 bg-black/70 text-white p-2 rounded-full hover:bg-black"
              >
                <IconX className="w-5 h-5" />
              </button>
            </div>

            <div className="p-5 overflow-y-auto custom-scroll flex-1 space-y-4">
              <div>
                <h3 className="text-xl font-black text-white font-display">{product.name}</h3>
                <p className="text-xs text-gray-300 mt-1 leading-relaxed">{product.description}</p>
              </div>

              {product.availableSauces && product.availableSauces.length > 0 && (
                <div className="border-t border-brand-border pt-3">
                  <h4 className="text-xs font-black uppercase tracking-wider text-brand-400 mb-2">
                    Salsas para tu Pedido (Elige tus favoritas):
                  </h4>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {product.availableSauces.map(sauce => {
                      const isChecked = selectedSauces.includes(sauce);
                      return (
                        <button
                          key={sauce}
                          type="button"
                          onClick={() => toggleSauce(sauce)}
                          className={`p-2.5 rounded-xl border text-left font-semibold flex items-center justify-between transition-all ${
                            isChecked
                              ? 'bg-brand-500/20 border-brand-500 text-brand-300'
                              : 'bg-black/30 border-white/10 text-gray-400 hover:text-white'
                          }`}
                        >
                          <span className="text-[11px]">{sauce}</span>
                          {isChecked && <IconCheck className="w-3.5 h-3.5 text-brand-400" />}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {product.availableExtras && product.availableExtras.length > 0 && (
                <div className="border-t border-brand-border pt-3">
                  <h4 className="text-xs font-black uppercase tracking-wider text-brand-400 mb-2">
                    Extras & Toppings Deliciosos:
                  </h4>
                  <div className="space-y-1.5 text-xs">
                    {product.availableExtras.map(extra => {
                      const isChecked = selectedExtras.some(e => e.name === extra.name);
                      return (
                        <button
                          key={extra.name}
                          type="button"
                          onClick={() => toggleExtra(extra)}
                          className={`w-full p-2.5 rounded-xl border text-left font-semibold flex items-center justify-between transition-all ${
                            isChecked
                              ? 'bg-brand-500/20 border-brand-500 text-brand-300'
                              : 'bg-black/30 border-white/10 text-gray-400 hover:text-white'
                          }`}
                        >
                          <div className="flex items-center gap-2">
                            <span className={`w-4 h-4 rounded border flex items-center justify-center ${isChecked ? 'bg-brand-500 border-brand-500 text-black' : 'border-gray-500'}`}>
                              {isChecked && <IconCheck className="w-3 h-3 text-black stroke-[3]" />}
                            </span>
                            <span className="text-xs">{extra.name}</span>
                          </div>
                          <span className="text-brand-400 font-extrabold">+${extra.price.toFixed(2)}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              <div className="border-t border-brand-border pt-3">
                <label className="text-[11px] font-bold text-gray-400 block mb-1">
                  Instrucciones especiales para el cocinero (Opcional):
                </label>
                <input
                  type="text"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Ej: Sin cebolla, salsas aparte, etc."
                  className="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500"
                />
              </div>
            </div>

            <div className="p-4 border-t border-brand-border bg-black/60 flex items-center gap-3">
              <div className="flex items-center bg-black border border-white/10 rounded-xl px-2 py-1">
                <button
                  type="button"
                  onClick={() => setQuantity(Math.max(1, quantity - 1))}
                  className="p-1 text-gray-400 hover:text-white"
                >
                  <IconMinus className="w-4 h-4" />
                </button>
                <span className="px-3 font-bold text-sm text-white">{quantity}</span>
                <button
                  type="button"
                  onClick={() => setQuantity(quantity + 1)}
                  className="p-1 text-gray-400 hover:text-white"
                >
                  <IconPlus className="w-4 h-4" />
                </button>
              </div>

              <button
                type="button"
                onClick={() => {
                  onAddToCart(product, {
                    quantity,
                    sauces: selectedSauces,
                    extras: selectedExtras,
                    extrasTotal,
                    notes
                  });
                }}
                className="flex-1 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-black font-black py-3 rounded-xl shadow-lg shadow-brand-500/20 text-xs uppercase tracking-wider flex items-center justify-between px-4"
              >
                <span>Agregar al Carrito</span>
                <div className="text-right leading-none">
                  <span className="text-sm font-black">${finalPrice.toFixed(2)}</span>
                  <span className="text-[10px] block opacity-80">Bs. {finalPriceBs}</span>
                </div>
              </button>
            </div>

          </div>
        </div>
      );
    }

    // ==========================================
    // 7. ORDER DIRECT CHAT MODAL
    // ==========================================
    function OrderChatModal({ order, role, onClose, newMessage, setNewMessage, onSendMessage }) {
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [order.messages]);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
          <div className="bg-[#181512] border border-brand-border rounded-3xl max-w-md w-full h-[520px] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div className="bg-[#201b16] px-4 py-3 border-b border-brand-border flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-full bg-brand-500/20 border border-brand-400 flex items-center justify-center text-lg">
                  💬
                </div>
                <div>
                  <h3 className="font-bold text-white text-sm">
                    Chat del Pedido #{order.id}
                  </h3>
                  <span className="text-[11px] text-emerald-400 flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    {role === 'client' ? 'Atención en Línea (Dueño / Repartidor)' : `Cliente: ${order.customerName}`}
                  </span>
                </div>
              </div>

              <button onClick={onClose} className="text-gray-400 hover:text-white p-1">
                <IconX className="w-5 h-5" />
              </button>
            </div>

            {role !== 'client' && (
              <div className="bg-black/40 px-3 py-1.5 border-b border-white/5 flex gap-1.5 overflow-x-auto text-[11px] custom-scroll">
                <button
                  onClick={() => setNewMessage('¡Hola! Tu pedido ya está en la plancha bien caliente 🔥')}
                  className="bg-white/5 hover:bg-white/10 px-2.5 py-1 rounded-lg text-gray-300 shrink-0"
                >
                  En plancha
                </button>
                <button
                  onClick={() => setNewMessage('¡El repartidor acaba de salir hacia tu dirección! 🛵')}
                  className="bg-white/5 hover:bg-white/10 px-2.5 py-1 rounded-lg text-gray-300 shrink-0"
                >
                  En camino
                </button>
                <button
                  onClick={() => setNewMessage('¡Pago Móvil verificado con éxito! Gracias por tu compra.')}
                  className="bg-white/5 hover:bg-white/10 px-2.5 py-1 rounded-lg text-gray-300 shrink-0"
                >
                  Pago OK
                </button>
              </div>
            )}

            <div className="flex-1 p-4 overflow-y-auto custom-scroll space-y-3 bg-[#110f0d]">
              {order.messages.map((m, idx) => {
                const isMe = (role === 'client' && m.sender === 'customer') ||
                             (role !== 'client' && (m.sender === 'admin' || m.sender === 'driver'));
                const isSystem = m.sender === 'system';

                if (isSystem) {
                  return (
                    <div key={idx} className="text-center my-2">
                      <span className="inline-block bg-black/60 border border-white/10 text-brand-300 text-[10px] px-3 py-1 rounded-full font-mono max-w-xs leading-tight">
                        {m.text}
                      </span>
                    </div>
                  );
                }

                return (
                  <div
                    key={idx}
                    className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}
                  >
                    <div
                      className={`max-w-[80%] rounded-2xl px-3.5 py-2 text-xs leading-relaxed ${
                        isMe
                          ? 'bg-brand-500 text-black font-semibold rounded-tr-none'
                          : 'bg-[#26201b] text-white border border-white/10 rounded-tl-none'
                      }`}
                    >
                      {m.text}
                    </div>
                    <span className="text-[9px] text-gray-500 mt-0.5 px-1 font-mono">
                      {m.time}
                    </span>
                  </div>
                );
              })}
              <div ref={messagesEndRef} />
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSendMessage();
              }}
              className="p-3 bg-[#181512] border-t border-brand-border flex items-center gap-2"
            >
              <input
                type="text"
                value={newMessage}
                onChange={(e) => setNewMessage(e.target.value)}
                placeholder="Escribe un mensaje..."
                className="flex-1 bg-black border border-white/10 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500"
              />
              <button
                type="submit"
                className="bg-brand-500 hover:bg-brand-400 text-black font-bold text-xs px-4 py-2.5 rounded-xl shadow active:scale-95"
              >
                Enviar
              </button>
            </form>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker registered'))
          .catch((err) => console.log('PWA SW error:', err));
      });
    }
  </script>
</body>
</html>
