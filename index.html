<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pepitos La Negra | El Auténtico Sabor Venezolano</title>
  <meta name="description" content="Pepitos gigantes de 30 cm mixtos, hamburguesas mixtas de pollo y carne, y marquesas de chocolate. El auténtico sabor callejero venezolano con delivery express en Barquisimeto.">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0d11">
  <link rel="icon" type="image/jpeg" href="./assets/logo-opt.jpg">
  <link rel="apple-touch-icon" href="./assets/logo-opt.jpg">

  <!-- Google Fonts: Montserrat & Poppins (Exact match to reference) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- EXACT CSS STYLES INSPIRED BY THE REFERENCE -->
  <style>
    :root {
      --bg-dark: #0a0705;
      --bg-darker: #060403;
      --bg-card: #140d0a;
      --bg-card-hover: #1f140f;
      --primary-gold: #f59e0b;
      --primary-gold-hover: #d97706;
      --primary-accent: #ea580c;
      --primary-accent-hover: #c2410c;
      --flame-red: #dc2626;
      --whatsapp: #25d366;
      --whatsapp-hover: #1eb956;
      --text-white: #ffffff;
      --text-cream: #fff7ed;
      --text-muted: #a89f91;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(245, 158, 11, 0.4);
      --border-flame: rgba(234, 88, 12, 0.35);
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Poppins', sans-serif;
      --radius-full: 9999px;
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      outline: none;
      transition: var(--transition);
    }

    /* =========================================================================
       1. HEADER FIJO (IDÉNTICO A LA REFERENCIA)
       ========================================================================= */
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 7, 5, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(245, 158, 11, 0.15);
      padding: 12px 0;
      transition: var(--transition);
    }

    .header-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 0 clamp(16px, 2.5vw, 36px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .brand-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--primary-gold);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
      background: #f4ece1;
      flex-shrink: 0;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text-block {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--primary-gold);
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 3px;
    }

    .nav-menu-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 0;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.6vw, 24px);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-link {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-white);
      position: relative;
      padding: 6px 2px;
      white-space: nowrap;
      transition: color 0.2s ease;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--primary-gold);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-whatsapp-header {
      background: var(--whatsapp);
      color: #ffffff;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      padding: 8px 15px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-whatsapp-header:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-2px);
    }

    .btn-admin-header {
      background: #181c24;
      border: 1.5px solid var(--primary-gold);
      color: var(--primary-gold);
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .btn-admin-header:hover, .btn-admin-header.active {
      background: var(--primary-gold);
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-orders-header {
      background: #1c132b;
      border: 1.5px solid #8b5cf6;
      color: #f1f5f9;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.8px;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.25);
      transition: all 0.22s ease;
    }

    .btn-orders-header:hover, .btn-orders-header.active {
      background: #8b5cf6;
      border-color: #a78bfa;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    }

    .orders-count-badge {
      background: #8b5cf6;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      min-width: 18px;
      text-align: center;
      line-height: 1.2;
    }

    .btn-cart-header {
      background: var(--primary-gold);
      color: #000000;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-cart-header:hover {
      background: var(--primary-accent);
      transform: translateY(-2px);
    }

    .cart-count-badge {
      background: #000000;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: var(--radius-full);
    }

    /* =========================================================================
       2. HERO SECTION (MODELO VISUAL EXACTO DE LA CAPTURA)
       ========================================================================= */
    .hero-section {
      position: relative;
      min-height: 92vh;
      display: flex;
      align-items: center;
      padding: 60px 24px 60px;
      background: radial-gradient(circle at 65% 45%, #2d140a 0%, #150a06 55%, #080504 100%);
      overflow: hidden;
    }

    .hero-watermark {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-heading);
      font-size: clamp(5rem, 13vw, 15rem);
      font-weight: 900;
      line-height: 0.85;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      letter-spacing: -2px;
    }

    .hero-watermark span {
      display: block;
      text-align: center;
      -webkit-text-stroke: 1.5px rgba(245, 158, 11, 0.06);
      color: transparent;
    }

    .hero-container {
      max-width: 1360px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      align-items: center;
      gap: 50px;
      position: relative;
      z-index: 2;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero-badge-pill {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--border-gold);
      color: var(--primary-accent);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hero-title-main {
      font-family: var(--font-heading);
      font-size: clamp(2.8rem, 5.2vw, 5.2rem);
      font-weight: 900;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .hero-title-main .title-white {
      display: block;
      color: var(--text-white);
    }

    .hero-title-main .title-highlight {
      display: block;
      color: var(--primary-gold);
      font-style: italic;
      font-weight: 900;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.6;
    }

    .hero-cta-group {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-primary-hero {
      background: var(--primary-gold);
      color: #000000;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      padding: 16px 32px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      cursor: pointer;
    }

    .btn-primary-hero:hover {
      background: var(--primary-accent);
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
    }

    .btn-secondary-hero {
      border: 2px solid #ffffff;
      color: #ffffff;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      padding: 14px 28px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      cursor: pointer;
    }

    .btn-secondary-hero:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary-gold);
      color: var(--primary-gold);
      transform: translateY(-3px);
    }

    /* Columna Derecha: Stack de Tarjetas 3D */
    .hero-visual-stack-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 480px;
    }

    .card-stack {
      position: relative;
      width: 320px;
      height: 450px;
    }

    .stack-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 14px;
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
      user-select: none;
    }

    .stack-card.card-back-left {
      transform: rotate(-7deg) translate(-28px, -12px) scale(0.95);
      z-index: 1;
    }

    .stack-card.card-back-right {
      transform: rotate(6deg) translate(28px, -8px) scale(0.96);
      z-index: 2;
    }

    .stack-card.card-front {
      transform: rotate(-1.5deg) translate(0, 0) scale(1);
      z-index: 5;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.2);
    }

    .card-stack:hover .card-back-left {
      transform: rotate(-10deg) translate(-38px, -15px) scale(0.95);
    }

    .card-stack:hover .card-back-right {
      transform: rotate(9deg) translate(38px, -10px) scale(0.96);
    }

    .card-stack:hover .card-front {
      transform: rotate(0deg) translateY(-6px) scale(1.02);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.7), 0 0 32px rgba(245, 158, 11, 0.3);
    }

    .card-img-box {
      width: 100%;
      height: 230px;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.85);
      color: var(--primary-gold);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
    }

    .card-details {
      padding: 12px 6px 4px;
      display: flex;
      flex-direction: column;
      color: #111827;
      flex: 1;
    }

    .card-flavor-name {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #0f172a;
      line-height: 1.2;
    }

    .card-desc-short {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .hero-size-single-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      color: #f59e0b;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 10px;
      width: fit-content;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .hero-card-price {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f172a;
    }

    .hero-quick-add {
      background: var(--whatsapp);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
    }

    .hero-quick-add:hover {
      background: var(--whatsapp-hover);
      transform: scale(1.05);
    }

    /* Sello Circular Giratorio */
    .rotating-stamp {
      position: absolute;
      bottom: -20px;
      right: -25px;
      width: 120px;
      height: 120px;
      z-index: 8;
      pointer-events: none;
    }

    .rotating-stamp svg {
      width: 100%;
      height: 100%;
      animation: spinStamp 18s linear infinite;
    }

    @keyframes spinStamp {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* =========================================================================
       3. CINTA MARQUEE / TICKER TAPE
       ========================================================================= */
    .marquee-ribbon {
      background: var(--primary-gold);
      color: #000000;
      padding: 14px 0;
      overflow: hidden;
      white-space: nowrap;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    .marquee-content {
      display: inline-flex;
      gap: 28px;
      animation: marquee 24s linear infinite;
    }

    .marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 28px;
    }

    .star-icon {
      font-size: 0.85rem;
      color: #000000;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* =========================================================================
       4. WHATSAPP FLOTANTE
       ========================================================================= */
    .floating-whatsapp-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .whatsapp-tooltip {
      background: #ffffff;
      color: #0f172a;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: floatTooltip 3s ease-in-out infinite;
    }

    .whatsapp-btn-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--whatsapp);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
      transition: all 0.25s ease;
    }

    .whatsapp-btn-circle:hover {
      background: var(--whatsapp-hover);
      transform: scale(1.1);
    }

    @keyframes floatTooltip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .nav-menu-wrapper { display: none; }
      .hero-container { grid-template-columns: 1fr; gap: 40px; text-align: center; }
      .hero-content { align-items: center; }
      .hero-subtitle { margin: 0 auto; }
      .hero-cta-group { justify-content: center; }
    }

    /* =========================================================================
       5. CHAT MODAL OVERLAY & WORKSPACE (PRIORIDAD MÁXIMA Z-INDEX: 999999)
       ========================================================================= */
    .chat-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999999 !important;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
      animation: fadeInModal 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInModal {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .chat-modal-box {
      background: #100a07;
      border: 1px solid rgba(245, 158, 11, 0.4);
      width: 100%;
      max-width: 880px;
      height: 90vh;
      max-height: 840px;
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.98), 0 0 45px rgba(245, 158, 11, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 640px) {
      .chat-modal-overlay {
        padding: 0;
      }
      .chat-modal-box {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    /* Ocultar barra de scroll horizontal en respuestas rápidas en todos los navegadores */
    .no-scrollbar::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    .no-scrollbar {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    /* Scrollbar vertical sutil y estilizado para los mensajes */
    .chat-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll-area::-webkit-scrollbar-track {
      background: #0d0705;
    }
    .chat-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.3);
      border-radius: 9999px;
    }
    .chat-scroll-area::-webkit-scrollbar-thumb:hover {

          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'cash') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.frequency.setValueAtTime(987.77, ctx.currentTime);
          osc2.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start();
          osc2.start(ctx.currentTime + 0.08);

                <h3 className="text-lg font-black text-white font-display">{selectedProduct.name}</h3>
                <p className="text-xs text-gray-400 mt-1">{selectedProduct.description}</p>
                <div className="mt-4 flex justify-between items-center border-t border-white/10 pt-4">
                  <span className="text-xl font-black text-amber-400">${selectedProduct.price.toFixed(2)}</span>
                  <button 
                    onClick={() => addToCart(selectedProduct, { quantity: 1, sauces: selectedProduct.defaultSauces })}
                    className="bg-amber-500 text-black font-extrabold text-xs px-5 py-2.5 rounded-full"
                  >
                    Añadir al Pedido
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
               CHAT EN PANEL ENTERO (WORKSPACE COMPLETO PARA CLIENTE Y GERENTE)
               ========================================================================= */}
          {chatOpen && activeChatOrder && (
            <div 
              className="chat-modal-overlay" 
              onClick={(e) => { if (e.target === e.currentTarget) setChatOpen(false); }}
            >
              <div className="chat-modal-box" onClick={(e) => e.stopPropagation()}>
                
                {/* 1. Header del Panel Entero con Botón Cerrar y Volver */}
                <div className="bg-[#180f0a] border-b border-amber-500/25 p-3 sm:px-6 flex items-center justify-between gap-3 flex-shrink-0">
                  
                  {/* Lado Izquierdo: Volver + Avatar + Nombre */}
                  <div className="flex items-center gap-3">
                    <button 
                      onClick={() => setChatOpen(false)}
                      className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-gray-200 hover:text-white flex items-center gap-1.5 transition text-xs font-bold border border-white/10 shadow"
                      title="Volver a la vista anterior (Esc)"
                    >
                      <span className="text-base leading-none">←</span>
                      <span className="hidden sm:inline">Volver</span>
                    </button>

                    <div className="relative flex-shrink-0">
                      <img src="./assets/logo-opt.jpg" alt="Logo Pepitos La Negra" className="w-10 h-10 rounded-full object-cover border-2 border-amber-500/50 shadow" />
                      <span className="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#180f0a] rounded-full"></span>
                    </div>

                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="font-black text-white text-sm sm:text-base font-display tracking-wide">
                          Pepitos La Negra
                        </h3>
                        <span className="text-[10px] bg-emerald-500/20 text-emerald-300 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">
                          En línea
                        </span>
                      </div>
                      <p className="text-[11px] text-amber-400 font-mono mt-0.5">
                        Pedido #{activeChatOrder.id} • {activeChatOrder.customerName}
                      </p>
                    </div>
                  </div>

                  {/* Lado Derecho: Botón Cerrar */}
                  <div className="flex items-center gap-2">
                    {/* BOTÓN CERRAR MUY VISIBLE */}
                    <button 
                      onClick={() => setChatOpen(false)}
                      className="px-3.5 py-1.5 rounded-xl bg-red-600/30 hover:bg-red-600 text-red-200 hover:text-white border border-red-500/40 flex items-center gap-1.5 transition text-xs font-black shadow-lg cursor-pointer active:scale-95"
                      title="Cerrar chat (o presiona Escape)"
                      aria-label="Cerrar chat"
                    >
                      <span className="text-sm font-bold">✕</span>
                      <span className="font-bold">Cerrar</span>
                    </button>
                  </div>
                </div>

                {/* 2. Barra de Resumen del Pedido (Elegante y Limpia) */}
                <div className="bg-[#140c08] border-b border-white/5 px-4 sm:px-6 py-2 flex flex-wrap items-center justify-between text-xs gap-2 flex-shrink-0">
                  <div className="flex flex-wrap items-center gap-2 sm:gap-3 text-gray-300 text-[11px]">
                    <div className="flex items-center gap-1">
                      <span className="text-gray-400">Total:</span>
                      <span className="text-amber-400 font-black">${(activeChatOrder.items.reduce((a, b) => a + (b.price * b.quantity), 0) + 1.50).toFixed(2)}</span>
                      <span className="text-gray-400 font-mono">(Bs. {activeChatOrder.totalBs})</span>
                    </div>
                    <span className="text-white/20">•</span>
                    <div className="flex items-center gap-1">
                      <span className="text-gray-400">Pago:</span>
                      <span className="text-white font-mono font-bold">Provincial ****{activeChatOrder.reference}</span>
                    </div>
                    <span className="hidden sm:inline text-white/20">•</span>
                    <div className="hidden sm:flex items-center gap-1 text-gray-400 truncate max-w-xs">
                      <span>📍</span>
                      <span className="truncate">{activeChatOrder.address}</span>
                    </div>
                  </div>
                  
                  <div className="flex items-center">
                    <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full border ${
                      activeChatOrder.status === 1 ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-300' :
                      activeChatOrder.status === 2 ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' :
                      activeChatOrder.status === 3 ? 'bg-blue-500/10 border-blue-500/30 text-blue-300' : 'bg-purple-500/10 border-purple-500/30 text-purple-300'
                    }`}>
                      {activeChatOrder.status === 1 ? '🟡 1. Por Pagar' :
                       activeChatOrder.status === 2 ? '🟢 2. Pago Verificado ✓' :
                       activeChatOrder.status === 3 ? '🔵 3. En Cocina / Delivery' : '🟣 4. Entregado'}
                    </span>
                  </div>
                </div>

                {/* 3. Área de Mensajes Principal (Full Scroll con Estilo) */}
                <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 bg-[#0d0705] chat-scroll-area">
                  {activeChatOrder.messages.map((m, i) => {
                    const isMe = m.sender === 'customer';
                    return (
                      <div key={i} className="w-full">
                        {m.sender === 'system' ? (
                          <div className="flex justify-center my-2">
                            <div className="bg-[#18100b] border border-amber-500/30 text-amber-200 text-[11px] font-mono px-4 py-1.5 rounded-full shadow-sm text-center leading-relaxed max-w-md">
                              {m.text}
                            </div>
                          </div>
                        ) : (
                          <div className={`flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[85%] sm:max-w-md ${isMe ? 'ml-auto' : 'mr-auto'}`}>
                            <span className="text-[10px] text-gray-400 px-1 mb-1 block">
                              {isMe ? '👤 Tú (Cliente)' : '👨‍🍳 Restaurante / Gerente'} • {m.time || 'Ahora'}
                            </span>
                            <div className={`p-3.5 sm:p-4 rounded-2xl text-xs sm:text-sm leading-relaxed shadow-lg ${
                              isMe
                                ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-black font-semibold rounded-tr-none'
                                : 'bg-[#1b120c] text-white border border-amber-500/30 rounded-tl-none'
                            }`}>
                              {m.text}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  <div ref={chatEndRef} />
                </div>

                {/* 4. Sugerencias Rápidas de Respuesta Exclusivas del Cliente */}
                <div className="bg-[#140c08] border-t border-white/5 px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar flex-shrink-0">
                  <span className="text-[10px] uppercase font-bold text-gray-400 whitespace-nowrap flex-shrink-0">
                    Preguntas rápidas:
                  </span>
                  {[
                    '¿En cuánto tiempo llega mi pedido? ⏱️',
                    'Ya realicé el Pago Móvil Provincial 💸',
                    '¿Me le pueden colocar salsa tártara extra? 🥫',
                    '¡Muchas gracias, estaré atento al delivery! 🛵'
                  ].map((chip, idx) => (
                    <button
                      key={idx}
                      onClick={() => sendClientChatMessage(chip)}
                      className="whitespace-nowrap bg-black/50 hover:bg-amber-500/20 border border-white/10 hover:border-amber-500/50 text-gray-300 hover:text-amber-300 px-3 py-1.5 rounded-full text-xs transition flex-shrink-0 cursor-pointer active:scale-95"
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                {/* 5. Input de Mensaje del Cliente */}
                <form 
                  onSubmit={(e) => { 
                    e.preventDefault(); 
                    if (newMessage.trim()) { 
                      sendClientChatMessage(newMessage); 
                    } 
                  }} 
                  className="bg-[#180f0a] border-t border-amber-500/25 p-3 sm:p-4 flex gap-2 sm:gap-3 flex-shrink-0"
                >
                  <input
                    type="text"
                    value={newMessage}
                    onChange={(e) => setNewMessage(e.target.value)}
                    placeholder="Escribe un mensaje al restaurante..."
                    className="flex-1 bg-[#090604] border border-amber-500/35 focus:border-amber-400 text-white rounded-xl px-4 py-3 text-xs sm:text-sm outline-none transition placeholder-gray-500 shadow-inner"
                    autoFocus
                  />
                  <button
                    type="submit"
                    className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-5 sm:px-6 py-3 rounded-xl text-xs sm:text-sm transition-all shadow-lg flex items-center gap-1.5 active:scale-95 flex-shrink-0 cursor-pointer"
                  >
                    <span>Enviar</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                  </button>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
